name: Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    paths: ["uv.lock"]

# Third-party actions are pinned to full commit SHAs so an upstream retag cannot change the code
# we execute; Renovate bumps each pin and its version comment together.
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
      # --no-emit-project: exclude the local editable project itself; pip-audit requires hashes
      # and cannot hash a local path, and the project has no CVEs to audit anyway.
      - name: Audit locked dependencies
        run: uv export --no-dev --no-emit-project --format requirements-txt | uvx pip-audit -r /dev/stdin
