name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (repo-wide policy, and it matters
      # most here: this workflow runs with `contents: write`). A mutable major tag lets an
      # upstream retag change the code we execute without any change landing in this repo.
      # Renovate bumps the pin and its version comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
      - name: Build sdist + wheel
        run: uv build
      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
      # PyPI publish (trusted publishing) and ghcr image are enabled in Phase 10/11.
