name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check src/mom tests
      - name: Import contracts
        run: uv run lint-imports

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: mypy (strict)
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --group test --python ${{ matrix.python-version }}
      # `--cov` (no argument) uses the coverage source in pyproject (domain/engine/adapters/config);
      # the run fails when that coverage drops below `fail_under` in [tool.coverage.report].
      - name: pytest + coverage gate
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mom-llm:ci .
      - name: Smoke — mom --version
        run: |
          set -euo pipefail
          version="$(docker run --rm mom-llm:ci --version)"
          echo "image reports version: ${version}"
          test -n "${version}"
      - name: Smoke — boot + /health
        run: |
          set -euo pipefail
          docker run -d --name mom-smoke \
            -e MOM_CONFIG=/config.yaml \
            -e MOM_API_TOKEN=ci-smoke-token \
            -v "${{ github.workspace }}/config.example.yaml:/config.yaml:ro" \
            mom-llm:ci
          healthy=0
          for attempt in $(seq 1 30); do
            if docker exec mom-smoke mom healthcheck >/dev/null 2>&1; then
              echo "healthy after ${attempt} attempt(s)"; healthy=1; break
            fi
            sleep 1
          done
          docker logs mom-smoke
          test "${healthy}" = "1"
      - name: Teardown
        if: always()
        run: docker rm -f mom-smoke >/dev/null 2>&1 || true

  # DEFERRED (issue #12): two gates are intentionally NOT wired — the tooling each needs does not
  # exist in this repo yet, and a job that "passes" without checking anything is worse than an
  # honest TODO.
  #  - docs-drift: no generator exists (docs/CONFIGURATION.md, .env.example, and the referenced
  #    schema/mom-config.schema.json are hand-maintained). Add a `mom schema`/`mom openapi`/config
  #    docs generator, then regenerate and `git diff --exit-code`.
  #  - open-responses-conformance: no installable conformance CLI to pin. The stateless
  #    /v1/responses subset is covered hermetically by tests/test_responses_api.py in the test job.
