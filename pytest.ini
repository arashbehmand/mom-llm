[pytest]
# Legacy v1 suite config. Scoped to tests/ during the v2 transition so bare `pytest` never
# picks up tests_v2/ (which requires the pyproject config: pythonpath=src). Run v2 with
# `pytest -c pyproject.toml`. This file is deleted at the Phase 11 cutover.
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    asyncio
