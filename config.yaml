    llms_to_query:
      - "oai52:m"
      - "g3f:h"
      - "cl46op:m"
      - "cl45st:l"
      - "grok41fr"
      - "qwn3max"
      - "ernie45t"
    concluding_llm: "oai52:m"
    concluding_prompt: "synth_creative"
    include_thinking_context: true

  # Online mom high - search-enabled models ensemble
  - name: "mom-oh"
    llms_to_query:
      - "oaio4mdr-o"
      - "g3p:h:o"
      - "g25p:h:o"
      - "cl46op:h:o"
      - "cl45st:h:o"
      - "grok41fr:o"
      - "plx-snrrp-o"
