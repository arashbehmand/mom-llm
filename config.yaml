llm_definitions:
  - base_name: oai54m
    model: openai/gpt-5.4-mini
    variants:
      - suffix: l
        params:
          reasoning_effort: low
      - suffix: m
        params:
          reasoning_effort: medium
      - suffix: h
        params:
          reasoning_effort: high
  - base_name: oai54
    model: openai/gpt-5.4
    variants:
      - suffix: l
        params:
          reasoning_effort: low
      - suffix: m
        params:
          reasoning_effort: medium
      - suffix: h
        params:
          reasoning_effort: high
      - suffix: xh
        params:
          reasoning_effort: xhigh
  - base_name: oai55pro
    model: openai/gpt-5.5-pro
    variants:
      - suffix: h
        params:
          reasoning_effort: high
      - suffix: xh
        params:
          reasoning_effort: xhigh
  - base_name: oai55
    model: openai/gpt-5.5
    variants:
      - suffix: n
        params:
          reasoning_effort: none
      - suffix: l
        params:
          reasoning_effort: low
      - suffix: m
        params:
          reasoning_effort: medium
      - suffix: h
        params:
          reasoning_effort: high
      - suffix: xh
        params:
          reasoning_effort: xhigh
  - base_name: oai54n
    model: openai/gpt-5.4-nano
  - base_name: oai53cdx
    model: openai/gpt-5.3-codex
    variants:
      - suffix: m
        params:
          reasoning_effort: medium
      - suffix: h
        params:
          reasoning_effort: high
  - base_name: g3f
    model: gemini/gemini-3-flash-preview
    variants:
      - suffix: l
        params:
          thinking_level: low
      - suffix: m
        params:
          thinking_level: medium
      - suffix: h
        params:
          thinking_level: high
        variants:
          - suffix: o
            params:
              web_search_options:
                search_context_size: high
  - base_name: g31p
    model: gemini/gemini-3.1-pro-preview
    variants:
      - suffix: l
        params:
          thinking_level: low
      - suffix: h
        params:
          thinking_level: high
        variants:
          - suffix: o
            params:
              web_search_options:
                search_context_size: high
  - base_name: g31fl
    model: gemini/gemini-3.1-flash-lite
    variants:
      - suffix: mi
        params:
          thinking_level: minimal
      - suffix: l
        params:
          thinking_level: low
      - suffix: m
        params:
          thinking_level: medium
      - suffix: h
        params:
          thinking_level: high
  - base_name: g35f
    model: gemini/gemini-3.5-flash
    variants:
      - suffix: mi
        params:
          thinking_level: minimal
      - suffix: l
        params:
          thinking_level: low
      - suffix: m
        params:
          thinking_level: medium
      - suffix: h
        params:
          thinking_level: high
        variants:
          - suffix: o
            params:
              web_search_options:
                search_context_size: high
  - base_name: cl46st
    model: anthropic/claude-sonnet-4-6
    variants:
      - suffix: l
        params:
          reasoning_effort: low
          thinking:
            type: adaptive
      - suffix: m
        params:
          reasoning_effort: medium
          thinking:
            type: adaptive
      - suffix: h
        params:
          reasoning_effort: high
          thinking:
            type: adaptive
        variants:
          - suffix: o
            params:
              web_search_options:
                search_context_size: high
    # - suffix: am
    #   params:
    #     reasoning_effort: max
    #     thinking:
    #       type: adaptive
  - base_name: cl45hk
    model: anthropic/claude-haiku-4-5-20251001
    variants:
      - suffix: m
        params:
          thinking:
            type: enabled
            budget_tokens: 4096
  - base_name: cl47op
    model: anthropic/claude-opus-4-7
    variants:
      - suffix: l
        params:
          reasoning_effort: low
          thinking:
            type: adaptive
      - suffix: m
        params:
          reasoning_effort: medium
          thinking:
            type: adaptive
      - suffix: h
        params:
          reasoning_effort: high
          thinking:
            type: adaptive
        variants:
          - suffix: o
            params:
              web_search_options:
                search_context_size: high
      - suffix: am
        params:
          reasoning_effort: max
          thinking:
            type: adaptive
  - base_name: grok420ma
    model: xai/grok-4.20-multi-agent
    api_mode: responses
  - base_name: grok43
    model: xai/grok-4.3
    variants:
      - suffix: l
        params:
          reasoning_effort: low
      - suffix: h
        params:
          reasoning_effort: high
        variants:
          - suffix: o
            api_mode: responses
            params:
              tools:
                - type: web_search
      - suffix: nr
        params:
          reasoning_effort: none
  - base_name: grokbuild
    model: openrouter/x-ai/grok-build-0.1

  - base_name: dsv4
    model: openrouter/deepseek/deepseek-v4-pro
    variants:
      - suffix: f
        model: openrouter/deepseek/deepseek-v4-flash
  - base_name: codestral
    model: mistral/codestral-2508
  - base_name: qwn36max
    model: openrouter/qwen/qwen3.6-max-preview
  - base_name: qwn3coder
    model: openrouter/qwen/qwen3-coder-next
  - base_name: k26
    model: openrouter/moonshotai/kimi-k2.6
  - base_name: glm51
    model: openrouter/z-ai/glm-5.1
  - base_name: ernie45t
    model: openrouter/baidu/ernie-4.5-300b-a47b
  - base_name: m27
    model: openrouter/minimax/minimax-m2.7
  # - base_name: oaio4mdr-o
  #   model: openai/o4-mini-deep-research-2025-06-26
  #   params:
  #     reasoning_effort: medium
  #     tools:
  #     - type: web_search_preview
  - base_name: plx-snrp-o
    model: openrouter/perplexity/sonar-pro-search
  - base_name: plx-snrrp-o
    model: openrouter/perplexity/sonar-reasoning-pro
  - base_name: plx-dr-o
    model: openrouter/perplexity/sonar-deep-research

prompt_definitions:
  - name: "synth_default"
    content: |
      Review all LLM replies in this conversation. They appear as assistant-role messages in the turns immediately following the `<<<<<<>>>>>>` separator (which comes after the final user message). Treat each such assistant-role message after that separator as a distinct expert response. Then proceed:

      1. Identify each response's key insight(s) and any conflicting points.
         - Note that not all experts are equally reliable.
         - If no assistant-role messages appear after the separator, state: "No expert responses were available."
         - If only one response appears, relay its key insight.
         - If a response is irrelevant to the original question, exclude it from synthesis; if all are irrelevant, state that.

      2. Synthesize a single, cohesive answer that:
         - Maintains the big picture and context of the original question.
         - Follows any output format or structure the user originally requested (e.g., JSON schema, bullet list, code block).
         - Considers each relevant expert perspective—and when an expert's underlying approach is sound but their stated conclusion is factually wrong, adopt the rationale but correct the mistake to present the accurate conclusion.
         - Combines and integrates only the strongest, most accurate insights.
         - Resolves or clearly explains any disagreements by choosing the most plausible, well-supported position.
         - Fills in missing information as needed, based on verified insights and logical inference.
         - If no relevant insights are available, indicate this or, if appropriate, answer the original question based on prior context.

      Only output the final synthesized answer—omit any private analysis or mention of consolidation. The response should read as a single, direct answer to the user.

  - name: "synth_creative"
    content: |
      Review all LLM replies in this conversation. They appear as assistant-role messages in the turns immediately following the `<<<<<<>>>>>>` separator (which comes after the final user message). Treat each such assistant-role message after that separator as a distinct expert response. Then proceed:

      1. Identify each response's key insight(s) and any conflicting points.
         - Note that not all experts are equally reliable.
         - If no assistant-role messages appear after the separator, state: "No expert responses were available."
         - If only one response appears, relay its key insight.
         - If a response is irrelevant to the original question, exclude it from synthesis; if all are irrelevant, state that.
      2. Synthesize a single, cohesive answer that:
         - Maintains the big picture and context of the original question.
         - Creatively mix the creativity elements from the different responses.
         - Follows any output format or structure the user originally requested (e.g., JSON schema, bullet list, code block).
         - Considers each relevant expert perspective—and when an expert's underlying approach is sound but their stated conclusion is factually wrong, adopt the rationale but correct the mistake to present the accurate conclusion.
         - If no relevant insights are available, indicate this or, if appropriate, answer the original question based on prior context.

      Only output the final synthesized answer—omit any private analysis or mention of consolidation. The response should read as a single, direct answer to the user.

  - name: "synth_search"
    content: |
      Review all LLM replies in this conversation. They appear as assistant-role messages in the turns immediately following the `<<<<<<>>>>>>` separator (which comes after the final user message). Treat each such assistant-role message after that separator as a distinct expert response. Then proceed:

      1. Identify each response's key insight(s) and any conflicting points.
         - Note that not all experts are equally reliable.
         - If no assistant-role messages appear after the separator, state: "No expert responses were available."
         - If only one response appears, relay its key insight.
         - If a response is irrelevant to the original question, exclude it from synthesis; if all are irrelevant, state that.
         - If the original question involved a request for up-to-date information, prioritize insights that reference recent data or events, you can use search tools yourself to gather more information.

      2. Synthesize a single, cohesive answer that:
         - Maintains the big picture and context of the original question.
         - Follows any output format or structure the user originally requested (e.g., JSON schema, bullet list, code block).
         - Considers each relevant expert perspective—and when an expert's underlying approach is sound but their stated conclusion is factually wrong, adopt the rationale but correct the mistake to present the accurate conclusion.
         - Combines and integrates only the strongest, most accurate insights.
         - Resolves or clearly explains any disagreements by choosing the most plausible, well-supported position.
         - Fills in missing information as needed, based on verified insights and logical inference.
         - If no relevant insights are available, indicate this or, if appropriate, answer the original question based on prior context.

      Only output the final synthesized answer—omit any private analysis or mention of consolidation. The response should read as a single, direct answer to the user.

# ==============================================================================
# Model Ensembles
# ==============================================================================
models:
  # Standard mom - balanced mix of models, low reasoning
  - name: "mom"
    llms_to_query:
      - "oai55:l"
      - "oai54m:l"
      - "g31p"
      - "cl47op:l"
      - "grok43:nr"
      - "qwn36max"
      - "glm51"
      - "k26"
    concluding_llm: "g31fl"
    concluding_prompt: "synth_default"
    include_thinking_context: true

  # Big mom - medium/high reasoning across providers
  - name: "bmom"
    llms_to_query:
      - "oai55:m"
      - "oai54m:h"
      - "g31p:h"
      - "g35f:h"
      - "cl47op:m"
      - "grok43:h"
      - "grok43:nr"
      - "k26"
      - "glm51"
      - "qwn36max"
      - "ernie45t"
    concluding_llm: "g31p"
    concluding_prompt: "synth_default"
    include_thinking_context: true

