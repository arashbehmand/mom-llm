# yaml-language-server: $schema=./schema/mom-config.schema.json
#
# MoM v2 configuration — the owner's real setup. No secrets: only the NAMES of the environment
# variables that hold them appear here.
#
# Online search is REQUEST-TRIGGERED for models that can toggle it (a `search:` block activates
# only when the client sends web_search) — no always-on ":online" variants. Perplexity Sonar is
# the exception: it is inherently online (no offline variant), so it carries no `search:` block.
version: 2
defaults:
  call:
    timeout: 20m
    retries: 3
    retry_backoff: 2s
cache:
  enabled: true
observability:
  langfuse:
    enabled: true
