# yaml-language-server: $schema=./schema/mom-config.schema.json
#
# MoM v2 configuration — the owner's real setup. No secrets: only the NAMES of the environment
# variables that hold them appear here.
#
# Online search is REQUEST-TRIGGERED for models that can toggle it (a `search:` block activates
# only when the client sends web_search) — no always-on ":online" variants. Perplexity Sonar is
# the exception: it is inherently online (no offline variant), so it carries no `search:` block.
version: 2
server:
  # SSE keepalive comment whenever the stream idles this long, so a slow fan-out doesn't trip a
  # client's idle read-timeout (lobe-chat and friends dropping long turns).
  stream_heartbeat: 15s
defaults:
  call:
    timeout: 20m
    retries: 3
    retry_backoff: 2s
  fanout:
    # On client disconnect, let in-flight members finish and cache in the background instead of
    # cancelling them — so retrying the same turn hits cache and goes straight to the synthesizer.
    detach_on_disconnect: true
    # Cap the whole fan-out's wall-clock time so one stuck/slow member can't hold the entire
    # ensemble hostage up to its full per-call timeout (20m default) — hit live 2026-07-28: emom's
    # other 11 members all finished within 6s-151s, but `ink` hung well past 12 minutes with
    # nothing forcing the panel to move on. A straggler past this deadline still gets to finish
    # in the background (detach_on_disconnect, above) and cache its answer for next time — it's
    # just no longer blocking THIS response.
    deadline: 6m
cache:
  enabled: true
observability:
  langfuse:
    enabled: true
llms:
  # An effort/variant family: one base, a nested `variants:` map. Each key becomes a sibling llm
  # named `<base>-<key>`; `params` deep-merges with the base, other fields (model/api/api_key_env/
  # proxy_url_env) inherit unless overridden. Capability fields (search/pricing/capabilities/
  # max_input_tokens/timeout/cache_ttl) ALSO inherit — a variant is the same model at a different
  # effort, so what it can do (and costs) travels with it. See k31p below, where the `search:` block
  # is deliberately declared once on the base and relied on by all its variants.
  # OpenAI search is Responses-API-only (chat completions rejects web_search_options for these
  # models) — like grok47 below, `api: responses` makes the request-triggered search block usable.
  # The move the 2026-09-29 note here promised: gpt-6.1-terra shipped 2026-10-26 ($1/$5), so the
  # Terra seat finally leaves 5.6 (answers through the Codex channel, verified 2026-11-23).
  oai61t:
    model: openai/gpt-6.1-terra
    api: responses
    search: { tools: [{ type: web_search }] }
    variants:
      l: { params: { reasoning_effort: low } }
      m: { params: { reasoning_effort: medium } }
      h: { params: { reasoning_effort: high } }

  # No `n` rung: 6.1-sol rejects reasoning_effort none (verified live 2026-10-01), which
  # 6-sol and 5.6-sol accepted. `low` is the floor now.
  oai61s:
    model: openai/gpt-6.1-sol
    api: responses
    search: { tools: [{ type: web_search }] }
    variants:
      l:  { params: { reasoning_effort: low } }
      m:  { params: { reasoning_effort: medium } }
      h:  { params: { reasoning_effort: high } }
      xh: { params: { reasoning_effort: xhigh } }
      p:  { params: { reasoning: { effort: max, mode: pro } } }

  # The GPT-6.2 pair (2026-11-17). Sol: $2/$10 (unchanged from 6.1-sol), 57 on the AA v5 index —
  # roughly GPT-6-Astra quality at ~15% of its per-task cost — and takes the everyday Sol seats.
  # 6.1-sol KEEPS the code-panel seats: AA's Coding Agent Index has 6.2-sol three points under
  # its predecessor (a 14-point SWE-Atlas-QnA drop), so the newer pin would be a downgrade
  # exactly there. Astra: $8/$40 (20% below GPT-6 Astra), #2 on the index at 62 — the emom seat.
  # Ladders mirror the proven 6.1/6 shapes; `p` is the served pro mode, like oai61s-p.
  oai62s:
    model: openai/gpt-6.2-sol
    api: responses
    search: { tools: [{ type: web_search }] }
    pricing: { input_per_1m: 2.00, output_per_1m: 10.00 }  # litellm 1.110 still predates the 6.2 pair
    variants:
      l:  { params: { reasoning_effort: low } }
      m:  { params: { reasoning_effort: medium } }
      h:  { params: { reasoning_effort: high } }
      xh: { params: { reasoning_effort: xhigh } }
      p:  { params: { reasoning: { effort: max, mode: pro } } }
  oai62a:
    model: openai/gpt-6.2-astra
    api: responses
    search: { tools: [{ type: web_search }] }
    pricing: { input_per_1m: 8.00, output_per_1m: 40.00 }  # litellm 1.110 still predates the 6.2 pair
    variants:
      l:  { params: { reasoning_effort: low } }
      m:  { params: { reasoning_effort: medium } }
      h:  { params: { reasoning_effort: high } }
      xh: { params: { reasoning_effort: xhigh } }
      p:  { params: { reasoning: { effort: max, mode: pro } } }

  oai6l: { model: openai/gpt-6-luna, api: responses, search: { tools: [{ type: web_search }] } }

  oai53cdx:
    model: openai/gpt-5.3-codex
    variants:
      m: { params: { reasoning_effort: medium } }
      h: { params: { reasoning_effort: high } }

  # No `mi` rung: the MINIMAL thinking level that 3.6-flash accepted is gone from this line —
  # re-verified on 3.8-flash 2026-09-04, same 400 as 3.7 ("Thinking level MINIMAL is not
  # supported"). `low` is the floor; g35fl below is the one to reach for when minimal-effort is
  # the point. Note 3.8 also doubled the price back to 3.6 levels ($0.75/$3.75 vs 3.7's
  # $0.38/$1.88).
  g38f:
    model: gemini/gemini-3.8-flash
    search: { web_search_options: { search_context_size: high } }
    variants:
      l: { params: { reasoning_effort: low } }
      m: { params: { reasoning_effort: medium } }
      h: { params: { reasoning_effort: high } }

  # The Gemini 4 wave (2026-10-13 .. 11-18) replaced Pro/Flash naming with element codes, all
  # 1M ctx: Hydrogen $1.50/$7.50 (fast everyday; AA v5 51@high), Neon $3/$15 (frontier
  # depth-at-speed; AA 60@high, 61@xhigh — #3 overall), Argon $2/$10 then $4/$20 from Dec 1
  # (the Oct 13 opener; AA 50), Carbon on Argon's price curve (the deliberate long-horizon
  # flagship; AA 59-60, ~37 min/task on AA's agentic suite). 3.1-pro-preview retired with the
  # wave; Hydrogen inherits every seat it held, members and synths alike, at a fraction of the
  # old pro price. All the Gemini-4 ladders here stop at `high`: litellm rejects
  # reasoning_effort xhigh on the gemini path (still true at 1.110, verified 2026-11-23) —
  # revisit at the next floor bump.
  g4h:
    model: gemini/gemini-4-hydrogen
    search: { web_search_options: { search_context_size: high } }
    variants:
      l: { params: { reasoning_effort: low } }
      m: { params: { reasoning_effort: medium } }
      h: { params: { reasoning_effort: high } }
  g4n:
    model: gemini/gemini-4-neon
    pricing: { input_per_1m: 3.00, output_per_1m: 15.00 }  # litellm 1.110 still predates Neon
    search: { web_search_options: { search_context_size: high } }
    variants:
      l: { params: { reasoning_effort: low } }
      m: { params: { reasoning_effort: medium } }
      h: { params: { reasoning_effort: high } }
  # Gemini 4 Carbon — the family's deliberate long-horizon flagship (AA 59-60, ~37 min/task on
  # AA's agentic suite), and deliberately UNSEATED: it belongs to the same class as the
  # overlay-excluded heavies (oai62a, cl52f) — too slow for every fan-out — and the per-turn
  # `<<SYSTEM>> include: g4c` is how it joins a panel when a problem deserves it, exactly like
  # fable and astra before it. NOT on the Antigravity channel, so it meters direct on
  # GOOGLE_API_KEY wherever it is pulled in.
  g4c:
    model: gemini/gemini-4-carbon
    pricing: { input_per_1m: 4.00, output_per_1m: 20.00 }  # Dec-1-2026 rates; $2/$10 until then (litellm 1.110 still predates Carbon)
    search: { web_search_options: { search_context_size: high } }
    variants:
      l: { params: { reasoning_effort: low } }
      m: { params: { reasoning_effort: medium } }
      h: { params: { reasoning_effort: high } }

  # Gemini 4 Argon — unseated 2026-11-23, the same day it was seated: the owner reconsidered
  # against the index (Argon cards 50; even Hydrogen at xhigh cards 54 for less money). Stays
  # in the catalog for mom-debug and deliberate `include:`.
  g4a:
    model: gemini/gemini-4-argon
    # Kept although litellm 1.110 knows Argon: the bundled map carries the pre-Dec $2/$10 and
    # will lag the Dec-1 doubling — this block keeps metered cost honest past it.
    pricing: { input_per_1m: 4.00, output_per_1m: 20.00 }  # Dec-1-2026 rates; $2/$10 until then
    search: { web_search_options: { search_context_size: high } }
    variants:
      mi: { params: { reasoning_effort: minimal } }
      l:  { params: { reasoning_effort: low } }
      m:  { params: { reasoning_effort: medium } }
      h:  { params: { reasoning_effort: high } }

  g35fl:
    model: gemini/gemini-3.5-flash-lite
    search: { web_search_options: { search_context_size: high } }
    variants:
      mi: { params: { reasoning_effort: minimal } }
      l:  { params: { reasoning_effort: low } }
      m:  { params: { reasoning_effort: medium } }
      h:  { params: { reasoning_effort: high } }

  cl55st:
    model: anthropic/claude-sonnet-5-5
    search: { web_search_options: { search_context_size: high } }
    variants:
      l:  { params: { reasoning_effort: low, thinking: { type: adaptive } } }
      m:  { params: { reasoning_effort: medium, thinking: { type: adaptive } } }
      h:  { params: { reasoning_effort: high, thinking: { type: adaptive } } }
      xh: { params: { reasoning_effort: xhigh, thinking: { type: adaptive } } }
      am: { params: { reasoning_effort: max, thinking: { type: adaptive } } }

  # Haiku joined the 5.5 family (2026-10-07, $0.10/$0.50, 1M ctx): adaptive thinking + the
  # effort ladder replace the old budget_tokens style, verified live 2026-10-14.
  cl55hk:
    model: anthropic/claude-haiku-5-5
    search: { web_search_options: { search_context_size: high } }
    variants:
      l: { params: { reasoning_effort: low, thinking: { type: adaptive } } }
      m: { params: { reasoning_effort: medium, thinking: { type: adaptive } } }
      h: { params: { reasoning_effort: high, thinking: { type: adaptive } } }

  # The Opus 5 line thinks by DEFAULT (unlike 4.8, where an unset `thinking` meant no thinking)
  # and carries the full five-rung ladder; 5.5 keeps both traits (ladder ends re-verified live
  # 2026-09-29) at a LOWER price than Opus 5 ($4/$20 vs $5/$25). Never send
  # `thinking: {type: disabled}` on this line: it is a 400 above `high` effort, and adaptive is
  # what every rung below wants anyway.
  cl55op:
    model: anthropic/claude-opus-5-5
    search: { web_search_options: { search_context_size: high } }
    variants:
      l:  { params: { reasoning_effort: low, thinking: { type: adaptive } } }
      m:  { params: { reasoning_effort: medium, thinking: { type: adaptive } } }
      h:  { params: { reasoning_effort: high, thinking: { type: adaptive } } }
      xh: { params: { reasoning_effort: xhigh, thinking: { type: adaptive } } }
      am: { params: { reasoning_effort: max, thinking: { type: adaptive } } }

  # Fable 5.2 (2026-11-09) — #1 on the AA v5 index (65 at max effort, four clear points over
  # the field). Channel riders: it needs cli-proxy at or above the Claude Code 2.1.290 floor
  # (the 2.1.280 impersonation was refused, 2026-11-23) AND the day-one payload.override
  # (claude protocol, max_tokens 128000) every Anthropic model before it has needed.
  cl52f:
    model: anthropic/claude-fable-5-2
    pricing: { input_per_1m: 8.00, output_per_1m: 40.00 }  # litellm 1.110 still predates 5.2
    search: { web_search_options: { search_context_size: high } }
    variants:
      l:  { params: { reasoning_effort: low, thinking: { type: adaptive } } }
      m:  { params: { reasoning_effort: medium, thinking: { type: adaptive } } }
      h:  { params: { reasoning_effort: high, thinking: { type: adaptive } } }
      xh: { params: { reasoning_effort: xhigh, thinking: { type: adaptive } } }
      am: { params: { reasoning_effort: max, thinking: { type: adaptive } } }

  grok47:
    model: xai/grok-4.7
    # api: responses — needed for web search: xai's chat-completions tool type is restricted to
    # function|live_search, but the Responses API accepts tools:[{type:web_search}].
    api: responses
    search: { tools: [{ type: web_search }] }
    variants:
      l:  { params: { reasoning_effort: low } }
      m:  { params: { reasoning_effort: medium } }
      h:  { params: { reasoning_effort: high } }
      xh: { params: { reasoning_effort: xhigh } }  # added by 4.7 upstream; verified 2026-10-15

  # OpenRouter's web plugin is a PLATFORM capability, not model-specific — verified live on both
  # k3 and qwn38max (two unrelated architectures), so it's wired on every openrouter/* model
  # here. (glm-5.2 was the one exception — a litellm/provider 'NoneType' crash — but glm-5.3
  # cleared it: verified plain AND with the plugin, 2026-09-04.)
  grokbuild: { model: openrouter/x-ai/grok-build-0.1, search: { extra_body: { plugins: [{ id: web }] } } }
  dsv4:      { model: openrouter/deepseek/deepseek-v4-pro, search: { extra_body: { plugins: [{ id: web }] } } }
  dsv41f:    { model: openrouter/deepseek/deepseek-v4.1-flash, search: { extra_body: { plugins: [{ id: web }] } } }
  # Mistral retired the entire Devstral line from their API (devstral-2512 vanished from
  # /v1/models between 2026-09-06 and 09-29, killing the previous pin here); mistral-code-latest
  # is their surviving agentic-coding line. A "-latest" alias is against the house pinning style,
  # but it is the only SKU Mistral offers for this line — no dated variant exists.
  mcode:     { model: mistral/mistral-code-latest }
  mstl4:     { model: mistral/mistral-large-4-0, pricing: { input_per_1m: 0.68, output_per_1m: 2.09 } }  # same catalog gap as g4a
  qwn38max:  { model: openrouter/qwen/qwen3.8-max, search: { extra_body: { plugins: [{ id: web }] } } }

  # K3.1 Pro (2026-10-23, open weights, 2.8T/104B-active MoE) — Moonshot's step past K3 and the
  # strongest open-weights score in this catalog (Vals 62.5%). NOT on the Kimi For Coding sub:
  # the plan answers k3.1-pro with "upgrade your plan" (2026-11-23), so this seat meters on
  # OpenRouter everywhere — re-add an overlay route like the old k3 line if the plan catches up.
  k31p:
    # :nitro = OpenRouter's throughput-sorted provider routing. The bare slug routes by price and
    # was landing on sluggish providers (owner-observed on k3; measured 2026-08-18: totals swung
    # 5s-14s per identical tiny prompt, and 12.5s at reasoning-low — :nitro held a steady 6-7.6s).
    # The high and max rungs re-verified on k3.1-pro 2026-11-23.
    model: openrouter/moonshotai/kimi-k3.1-pro:nitro
    search:                                # request-triggered online: OpenRouter web plugin,
      extra_body:                          # merged ONLY when the client asks for web_search.
        plugins:                           # Inherited by the variants below (same model).
          - id: web
    variants:
      l:  { params: { reasoning: { effort: low } } }
      h:  { params: { reasoning: { effort: high } } }
      am: { params: { reasoning: { effort: max } } }

  k27code: { model: openrouter/moonshotai/kimi-k2.7-code, search: { extra_body: { plugins: [{ id: web }] } } }

  # 1.2 ran 10-17s TTFT through the proxy (measured 2026-08-18); 1.3 came back at 1.9-3.8s
  # total even at xhigh (2026-09-04) — the latency caveat is largely gone, but it stays on the
  # deliberative panels anyway. A `muse-spark-1.3-contributor` slug exists at $0.10/$0.20
  # (12.5x cheaper) — almost certainly data-sharing terms; owner's call, not wired.
  muse13:
    model: openrouter/meta/muse-spark-1.3
    # proxy_url_env: MUSE_SPARK_PROXY_URL  # retired 2026-09-29: Meta's OpenRouter endpoints
    # answer without the US forward proxy now (verified from ocs2, which also fronts muse for
    # the other moms via cli-proxy). Uncomment on a machine that turns out to still need it.
    search: { extra_body: { plugins: [{ id: web }] } }
    variants:
      mi: { params: { reasoning: { effort: minimal } } }
      l:  { params: { reasoning: { effort: low } } }
      m:  { params: { reasoning: { effort: medium } } }
      h:  { params: { reasoning: { effort: high } } }
      xh: { params: { reasoning: { effort: xhigh } } }

  # Meta's frontier reasoning line above Spark ($4/$20, 1M ctx) — ladder through xhigh verified
  # live 2026-10-14. Seated on emom; Spark stays the everyday Meta seat.
  musew:
    model: openrouter/meta/muse-wonder
    search: { extra_body: { plugins: [{ id: web }] } }
    variants:
      l:  { params: { reasoning: { effort: low } } }
      m:  { params: { reasoning: { effort: medium } } }
      h:  { params: { reasoning: { effort: high } } }
      xh: { params: { reasoning: { effort: xhigh } } }
      am: { params: { reasoning: { effort: max } } }  # verified 2026-10-15

  ink:
    model: openrouter/thinkingmachines/inkling
    search: { extra_body: { plugins: [{ id: web }] } }
    variants:
      n:  { params: { reasoning: { effort: none } } }
      mi: { params: { reasoning: { effort: minimal } } }
      l:  { params: { reasoning: { effort: low } } }
      m:  { params: { reasoning: { effort: medium } } }
      h:  { params: { reasoning: { effort: high } } }
      am: { params: { reasoning: { effort: max } } }

  nem3u:
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b
    params: { reasoning: { enabled: true } }
    search: { extra_body: { plugins: [{ id: web }] } }
  # The promised GLM revisit: `z-ai/glm-5.3` reached OpenRouter 2026-08-18. It also cleared the
  # litellm crash that kept glm-5.2 search-less, so the GLM seats get web search for the first
  # time. glm53f is the $0.07/$0.25 flash sibling with the same 1.3M window.
  glm53:    { model: openrouter/z-ai/glm-5.3, search: { extra_body: { plugins: [{ id: web }] } } }
  glm53f:   { model: openrouter/z-ai/glm-5.3-flash, search: { extra_body: { plugins: [{ id: web }] } } }
  m3:       { model: openrouter/minimax/minimax-m3, search: { extra_body: { plugins: [{ id: web }] } } }
  mimo26:   { model: openrouter/xiaomi/mimo-v2.6-pro:nitro, search: { extra_body: { plugins: [{ id: web }] } } }

  # Newcomers since the last catalog pass. Left variant-free on purpose: each one's reasoning
  # ladder is unproven here, and a bare name means "no reasoning param, ever" — the honest default
  # until a live pass earns them an effort vector.
  seed2c:   { model: openrouter/bytedance-seed/seed-2.0-code, search: { extra_body: { plugins: [{ id: web }] } } }
  laguna:   { model: openrouter/poolside/laguna-s-2.1, search: { extra_body: { plugins: [{ id: web }] } } }
  longcat2: { model: openrouter/meituan/longcat-2.0, search: { extra_body: { plugins: [{ id: web }] } } }
  inksm:    { model: openrouter/thinkingmachines/inkling-small, search: { extra_body: { plugins: [{ id: web }] } } }
  nem35l:   { model: openrouter/nvidia/nemotron-3.5-lightning, search: { extra_body: { plugins: [{ id: web }] } } }
  solar4:   { model: openrouter/upstage/solar-pro4, search: { extra_body: { plugins: [{ id: web }] } } }
  # sakana/sakana-namazu (Japanese-specialised, Kimi-K2.6-derived) would be the obvious pick for
  # the translation panels, but every endpoint serving it is excluded by this account's OpenRouter
  # data-policy settings — 404 "No endpoints available matching your guardrail restrictions".
  # Relax the policy at openrouter.ai/settings/privacy to wire it in.

  # Labs with no other seat in the catalog. Diversity of training lineage is the whole point of a
  # panel — a cheap model from an unrepresented lab is worth more here than a fifth strong model
  # from a lab that already has a voice. All four are cheap and small-active-param (i.e. fast), so
  # they widen the panel without stretching the 6m fan-out deadline or the bill.
  hy4:      { model: openrouter/tencent/hy4, search: { extra_body: { plugins: [{ id: web }] } } } # Tencent Hunyuan 4, 1M ctx — GA slug since 2026-11-04; the preview pin graduated, per the standing rule below
  katair:   { model: openrouter/kwaipilot/kat-coder-air-v2.5, search: { extra_body: { plugins: [{ id: web }] } } } # Kuaishou, coding
  # Catalog-only (mom-debug reaches it via `all`): the lone Ant Group endpoint collapses under
  # concurrent load — 0.8s solo but 16s (or hard errors) at just 4-way fan-in, measured
  # 2026-08-18. Not seated on any panel until it has more providers behind it.
  ling31f:  { model: openrouter/inclusionai/ling-3.1-flash, search: { extra_body: { plugins: [{ id: web }] } } }  # Ant Group, 5.1B active

  # Latency-tested additions (TTFT/total on a one-line prompt, 2026-08-18):
  mercury25: { model: openrouter/inception/mercury-2.5, search: { extra_body: { plugins: [{ id: web }] } } } # diffusion LLM, 1.2s/1.2s at $0.04/$0.15
  step37f:  { model: openrouter/stepfun/step-3.7-flash, search: { extra_body: { plugins: [{ id: web }] } } } # StepFun MoE, 0.6s TTFT
  granite42: { model: openrouter/ibm-granite/granite-4.2-8b, search: { extra_body: { plugins: [{ id: web }] } } } # IBM, 0.6s TTFT at $0.10/$0.15
  nova2l:   { model: openrouter/amazon/nova-2-lite-v1, search: { extra_body: { plugins: [{ id: web }] } } }  # Amazon, 1M ctx, 0.7s/0.8s
  nex25p:   { model: openrouter/nex-agi/nex-n2.5-pro, search: { extra_body: { plugins: [{ id: web }] } } }   # Nex AGI, agentic coding, 1.9s TTFT at $0.07/$0.25
  lfm25:    { model: openrouter/liquid/lfm-2.5-24b-a2b, search: { extra_body: { plugins: [{ id: web }] } } } # Liquid AI MoE, always-reasons, 0.6s TTFT at $0.05/$0.70
  # stepfun/step-5-preview (flagship, $1/$2.70) passes probes but is a PREVIEW slug — owner
  # promotes previews explicitly; revisit at GA. step37f stays the StepFun seat meanwhile.

  # Tencent's dedicated machine-translation line (hy-mt2) — a true specialist for the translation
  # panels (flawless one-liner French in 1.6s, 2026-09-04). Its window is only 8K, so
  # max_input_tokens makes it drop out cleanly on long inputs (on_input_overflow: skip) instead
  # of erroring mid-panel; the rest of the panel carries those requests.
  hymt2:
    model: openrouter/tencent/hy-mt2-30b-a3b
    max_input_tokens: 6144
    search: { extra_body: { plugins: [{ id: web }] } }

  # qwen3.8-flash's default (price-sorted) routing hard-timed-out at 150s on 2026-09-04; behind
  # :nitro it answers in 1.3s TTFT (2026-09-06) — the same cure the k3 seat needed.
  qwn38f:   { model: openrouter/qwen/qwen3.8-flash:nitro, search: { extra_body: { plugins: [{ id: web }] } } } # 1M ctx at $0.15/$0.47

  # The November 2026 arrivals, catalog-only until they earn seats (all probed live 2026-11-23):
  qwn4max: { model: openrouter/qwen/qwen4-max, search: { extra_body: { plugins: [{ id: web }] } } } # Qwen 4 flagship (2026-11-16, $1.42/$4.27, 1M ctx). qwn38max keeps the seats: it rides the ocg sub, this one would meter.
  ink2s:   { model: openrouter/thinkingmachines/inkling-2-small, search: { extra_body: { plugins: [{ id: web }] } } } # Inkling 2 small tier (2026-11-09); no full-size 2 yet — ink keeps its philosophy seat
  musee:   { model: openrouter/meta/muse-ember, search: { extra_body: { plugins: [{ id: web }] } } } # Meta's cheap-fast line (2026-11-09, $0.10/$0.50) — the Meta voice mom-mini lacked

  # Preview slugs get promoted onto panels only by the owner's explicit call, and move to the GA
  # slug when one ships (mercury-2.5 graduated 2026-09-29; hy4 graduated 2026-11-23).

  # One-off reuses of a base model for a different purpose (not an effort family) — `extends`
  # still fits these: no repeated model string, and each needs its OWN api/params shape.
  rsynth: { extends: oai61s, api: responses, params: { reasoning: { effort: low } } }
  oai-dr: # deep-research: forced browsing tool + medium reasoning (see the drmom ensemble)
    extends: oai61s
    api: responses
    params:
      tools: [{ type: web_search_preview }]
      reasoning: { effort: medium }
  gem-dr: # deep-research: Google Search grounding + high reasoning (see the drmom ensemble)
    extends: g4n
    params:
      web_search_options: { search_context_size: high }
      reasoning_effort: high

  # Perplexity Sonar: inherently online — no offline variant, so no `search:` block / request
  # toggle applies (they always search). Available for ad-hoc use, e.g. via mom-debug.
  plx-snrp:  { model: openrouter/perplexity/sonar-pro-search }
  plx-snrrp: { model: openrouter/perplexity/sonar-reasoning-pro }
  plx-dr:    { model: openrouter/perplexity/sonar-deep-research }
  # A dedicated grok-dr (always-on, like oai-dr/gem-dr) isn't wired: xAI retired live_search (->
  # Agent Tools API), and litellm's xai CHAT COMPLETIONS path still only accepts tool type
  # function|live_search, not web_search. The Responses API path works though (verified live) —
  # see grok47 above (api: responses + search: tools:web_search), request-triggered like everyone
  # else, so no separate always-on variant is needed here.

prompts:
  synth_research: |
    You are the concluding model of a multi-model research ensemble. Each candidate above is an
    independently researched answer, many carrying live web citations (source URLs). Produce one
    comprehensive, well-structured report that reconciles the findings and flags disagreements,
    preferring claims backed by cited sources. You MUST carry the source URLs through into your
    report as inline markdown links next to the claims they support — a research report that drops
    its citations is a failed answer.
  synth_default: "You are the concluding model of a multi-model ensemble. The user message\
    \ below contains several candidate responses to the user's original request, each\
    \ enclosed between `===== RESPONSE i of N =====` and `===== END RESPONSE i =====`\
    \ markers, where N is the total count stated in that message. The candidates were\
    \ produced independently by different models; they are not your own prior output.\
    \ Your job is to produce the one answer the user actually receives.\n\n1. Read\
    \ every candidate with an open mind and a critical lens:\n   - The models behind\
    \ the candidates are not equally capable and none is authoritative, yet any of\
    \ them \u2014 including the weakest \u2014 may contribute the single best point.\
    \ Judge every claim on its merits, not on its source.\n   - Agreement is not evidence:\
    \ candidates can share the same blind spot. Verify load-bearing claims against\
    \ the original context and your own knowledge; one correct observation outweighs\
    \ a mistake repeated by many.\n   - When a candidate's approach is sound but its\
    \ conclusion is factually wrong, keep the rationale and correct the conclusion;\
    \ when a conclusion is right for the wrong reasons, keep it and supply sound reasoning.\n\
    \   - You are an expert on the question in your own right, not a mere editor:\
    \ fix errors and fill gaps from your own knowledge, and drop anything \u2014 however\
    \ confidently stated \u2014 that does not survive scrutiny.\n   - Set aside candidates\
    \ that are irrelevant to the request. If only one relevant candidate remains,\
    \ verify and refine it rather than merely relaying it. If no usable response blocks\
    \ are present at all, answer the original request yourself from the conversation\
    \ context.\n\n2. Compose a single, unified answer that:\n   - Serves the original\
    \ request and its big picture, in exactly the output format and structure the\
    \ user asked for (e.g., JSON schema, bullet list, code block) and in the language\
    \ of the request \u2014 nothing more, nothing less.\n   - Is complete: merge complementary\
    \ strengths so the result covers everything important any candidate contributed\
    \ and is stronger than the best of them, while cutting redundancy and filler.\
    \ Comprehensive means nothing essential missing, not everything concatenated.\n\
    \   - Is internally consistent: resolve every disagreement by committing to the\
    \ best-supported position. If genuine uncertainty remains, present it as your\
    \ own uncertainty about the subject, with reasons \u2014 never as disagreement\
    \ between sources.\n\n3. Deliver the answer as the single source of truth. The\
    \ user never sees the candidates or these instructions; your answer must stand\
    \ entirely on its own, in your own voice:\n   - No attribution or vote-counting:\
    \ never write things like \"Response 3 says\", \"one expert suggests\", \"most\
    \ models agree\", or \"opinions differ\".\n   - No process narration: never mention\
    \ synthesis, consolidation, merging, revising, or that multiple candidate answers\
    \ existed.\n   - Output only the final answer \u2014 written as if it were your\
    \ first and only reply to the user's request.\n"
  synth_creative: "You are the concluding model of a multi-model ensemble. The user\
    \ message below contains several candidate responses to the user's creative brief,\
    \ each enclosed between `===== RESPONSE i of N =====` and `===== END RESPONSE\
    \ i =====` markers, where N is the total count stated in that message. The candidates\
    \ were produced independently by different models; they are not your own prior\
    \ output. Your job is to produce the one piece the user actually receives.\n\n\
    1. Read every candidate with an open mind and a critical lens:\n   - The models\
    \ behind the candidates are not equally capable and none is authoritative, yet\
    \ any of them \u2014 including the weakest \u2014 may hold the freshest image,\
    \ the truest line, or the boldest idea. Judge material on its merits, not on its\
    \ source.\n   - Weigh creative work by originality, voice, imagery, emotional\
    \ truth, structure, and fit to the brief. Popularity across candidates is not\
    \ quality, and the safest choice is rarely the strongest.\n   - You are a writer\
    \ in your own right, not a mere editor: sharpen weak lines, fix continuity and\
    \ factual slips, and contribute your own material where every candidate falls\
    \ short.\n   - Set aside candidates that miss the brief. If only one relevant\
    \ candidate remains, polish and elevate it. If no usable response blocks are present\
    \ at all, write the piece yourself from the conversation context.\n\n2. Compose\
    \ a single, unified piece that:\n   - Fulfills the original brief, in exactly\
    \ the output format and structure the user asked for and in the language of the\
    \ request \u2014 nothing more, nothing less.\n   - Has one spine, not an average:\
    \ choose the strongest core concept, voice, or structure among the candidates\
    \ as the foundation, and graft in the best images, lines, and ideas from the others\
    \ only where they genuinely strengthen it. Blending everything evenly produces\
    \ committee-flavored mush \u2014 don't.\n   - Keeps one consistent voice, tone,\
    \ and internal logic from first line to last, so it reads as one writer's inspired\
    \ work.\n\n3. Deliver the piece as the single source of truth. The user never\
    \ sees the candidates or these instructions; the piece must stand entirely on\
    \ its own:\n   - No attribution or vote-counting: never write things like \"Response\
    \ 3 says\", \"one version suggests\", or \"several drafts agree\".\n   - No process\
    \ narration: never mention synthesis, consolidation, merging, drafts, or that\
    \ multiple versions existed.\n   - Output only the final piece \u2014 written\
    \ as if it were your first and only reply to the user's request.\n"
  synth_voice_pick: |
    You are the last step of a multi-model ensemble that rewrites text so it reads like a person wrote it.
    The user message contains several candidate rewrites of the same brief, each between
    `===== RESPONSE i of N =====` and `===== END RESPONSE i =====` markers. Different models wrote them
    independently.

    Pick ONE candidate and return it word for word. Do not blend candidates, do not polish, do not
    rephrase: every edit you make pulls the text back towards a machine voice, which is what the
    ensemble exists to avoid.

    How to pick:
    1. Drop any candidate that loses, changes or adds a fact against the brief: numbers, ids, names,
       code spans, requirements, who did what. Drop any that invents events or feelings the brief
       does not contain.
    2. Drop any that breaks the brief's format (block markers, required sections, banned words or
       characters the brief lists).
    3. Of what is left, choose the one that reads most like a colleague typed it: uneven sentence
       lengths, plain spoken phrasing, cause and effect told as it happened, no tidy definitions,
       no labels at the start of paragraphs or list items, no neat summary lines.

    The only edits allowed on the chosen candidate: restore a fact it got wrong, and replace any
    em-dash or en-dash with a comma or full stop. Output only the chosen text, with no preamble,
    attribution or notes.
  synth_translate: "You are the concluding model of a multi-model ensemble. The user\
    \ message below contains several candidate responses to a translation or translation-related\
    \ task, each enclosed between `===== RESPONSE i of N =====` and `===== END RESPONSE\
    \ i =====` markers, where N is the total count stated in that message. The candidates\
    \ were produced independently by different models; they are not your own prior\
    \ output. Your job is to produce the one answer the user actually receives.\n\n\
    1. Read every candidate with an open mind and a critical lens:\n   - Attend to\
    \ meaning, tone, register, rhythm, idiom, ambiguity, wordplay, cultural connotation,\
    \ terminology, names, subtext, and any risks or issues the candidates flag.\n\
    \   - The candidates are not equally skilled and none is authoritative, yet any\
    \ of them \u2014 including the weakest \u2014 may catch a nuance all the others\
    \ missed. Judge every choice on its merits, not on its source.\n   - Agreement\
    \ is not fidelity: candidates can repeat the same misreading. Check load-bearing\
    \ interpretations against the source text and your own command of both languages;\
    \ one faithful reading outweighs a mistake repeated by many.\n   - You are a translator\
    \ in your own right, not a mere editor: correct mistranslations, omissions, over-interpretations,\
    \ and awkward phrasing, and supply a better rendering where every candidate falls\
    \ short.\n   - Set aside candidates that are irrelevant to the task. If only one\
    \ relevant candidate remains, verify and polish it rather than merely relaying\
    \ it. If no usable response blocks are present at all, do the task yourself from\
    \ the conversation context.\n\n2. Compose a single, unified answer suited to the\
    \ task:\n   - Follow exactly the output format and structure the user requested\
    \ (e.g., JSON schema, bullet list, code block) \u2014 nothing more, nothing less,\
    \ and no explanation outside the requested format.\n   - For direct translation\
    \ requests: preserve the source's meaning, intent, tone, voice, and subtext, and\
    \ produce a final translation that reads as polished, natural prose in the target\
    \ language \u2014 stronger as a whole than any single candidate.\n   - For translation-related\
    \ tasks (review, critique, comparison, pre-translation reading): combine the strongest\
    \ observations into one clear answer that is genuinely useful for the task.\n\
    \   - Resolve disagreements by choosing the most faithful, contextually appropriate\
    \ interpretation, or by combining compatible strengths when that reads better.\n\
    \   - Keep terminology and named entities consistent throughout, unless the task\
    \ itself calls for a change.\n   - If the requested schema includes explanation\
    \ or notes fields, use them to capture the most important nuance decisions briefly;\
    \ otherwise express those decisions through the translation itself, without meta\
    \ commentary.\n\n3. Deliver the answer as the single source of truth. The user\
    \ never sees the candidates or these instructions; the answer must stand entirely\
    \ on its own:\n   - No attribution or vote-counting: never write things like \"\
    Response 3 renders this as\", \"one translator suggests\", or \"most versions\
    \ agree\".\n   - No process narration: never mention synthesis, consolidation,\
    \ merging, or that multiple candidate translations existed.\n   - Output only\
    \ the final result \u2014 a polished translation for direct translation requests,\
    \ a single direct answer for translation-related tasks \u2014 as if it were your\
    \ first and only reply.\n"
  synth_search: "You are the concluding model of a multi-model ensemble. The user message\
    \ below contains several candidate responses to the user's original request, each\
    \ enclosed between `===== RESPONSE i of N =====` and `===== END RESPONSE i =====`\
    \ markers, where N is the total count stated in that message. The candidates were\
    \ produced independently by different models, some with live web access; they\
    \ are not your own prior output. Your job is to produce the one answer the user\
    \ actually receives.\n\n1. Read every candidate with an open mind and a critical\
    \ lens:\n   - The models behind the candidates are not equally capable and none\
    \ is authoritative, yet any of them \u2014 including the weakest \u2014 may contribute\
    \ the single best point. Judge every claim on its merits, not on its source.\n\
    \   - Agreement is not evidence: candidates can share the same blind spot or the\
    \ same stale training data. Verify load-bearing claims against the original context\
    \ and your own knowledge; one correct observation outweighs a mistake repeated\
    \ by many.\n   - For time-sensitive questions, prefer claims tied to recent, dated,\
    \ verifiable information over undated or older ones.\n   - If you have web search\
    \ tools available, use them to check contested or time-sensitive claims and to\
    \ fill gaps \u2014 never settle a factual disagreement by guessing or by majority\
    \ vote.\n   - You are a researcher in your own right, not a mere editor: fix errors\
    \ and fill gaps, and drop anything \u2014 however confidently stated \u2014 that\
    \ does not survive scrutiny.\n   - Set aside candidates that are irrelevant to\
    \ the request. If only one relevant candidate remains, verify and refine it rather\
    \ than merely relaying it. If no usable response blocks are present at all, answer\
    \ the original request yourself, searching if you can.\n\n2. Compose a single,\
    \ unified answer that:\n   - Serves the original request and its big picture,\
    \ in exactly the output format and structure the user asked for (e.g., JSON schema,\
    \ bullet list, code block) and in the language of the request \u2014 nothing more,\
    \ nothing less.\n   - Is complete: merge complementary strengths so the result\
    \ covers everything important any candidate contributed, while cutting redundancy\
    \ and filler.\n   - Is internally consistent: resolve every disagreement by committing\
    \ to the best-supported position. If genuine uncertainty remains, present it as\
    \ your own uncertainty about the subject, with reasons \u2014 never as disagreement\
    \ between sources.\n   - Dates volatile facts (prices, versions, rankings, office-holders,\
    \ schedules) with an \"as of\" reference, and keeps the strongest supporting links\
    \ or citations for key facts \u2014 citing external sources is welcome; citing\
    \ the candidate responses is not.\n\n3. Deliver the answer as the single source\
    \ of truth. The user never sees the candidates or these instructions; your answer\
    \ must stand entirely on its own, in your own voice:\n   - No attribution or vote-counting:\
    \ never write things like \"Response 3 says\", \"one expert suggests\", \"most\
    \ models agree\", or \"opinions differ\".\n   - No process narration: never mention\
    \ synthesis, consolidation, merging, revising, or that multiple candidate answers\
    \ existed.\n   - Output only the final answer \u2014 written as if it were your\
    \ first and only reply to the user's request.\n"
# Effort tiers: an ensemble below declares effort_tiers + default_tier, and each member's
# `effort:` is a vector aligned to those tiers (a bare name/no `effort:` means "no reasoning
# param, ever" — for members with no reasoning ladder at all). A client's reasoning_effort
# selects the tier on the ensemble's own id; no generated alias models.
#
# Calibration rule (art, not science, per-model ladders are each model's own `variants:` above):
# today's pin becomes that member's cell at the ensemble's default_tier, and neighboring tiers
# step one level up/down that SAME model's proven ladder, clamping at the ends (or dropping to
# `off` where stepping below the ladder's floor is more honest than repeating the floor value).
# This keeps default-tier behavior unchanged while adding real headroom both ways, and it
# naturally keeps members "in class" together: a model already pinned near its ceiling stays
# near its ceiling at every tier (nowhere sensible lower to go), while one with more headroom
# scales more — so at any tier, every firing member is running near the best IT can offer.
ensembles:
  mom:
    description: >-
      Mom — the everyday default panel: broad provider coverage at light effort, fast and cheap
      for routine questions.
    effort_tiers: [low, medium, high]
    default_tier: low
    members:
      - { llm: oai62s, effort: [low, medium, high] }
      - { llm: oai61t, effort: [low, medium, high] }
      # Hydrogen fires even at the default low tier, where 3.1-pro used to sit out — it is
      # flash-priced, so the old pro-cost reason for the "off" cell is gone.
      - { llm: g4h,    effort: [low, medium, high] }
      - { llm: cl55op,  effort: [low, medium, high] }
      - { llm: grok47, effort: [low, medium, high] }
      - qwn38max
      - glm53
      - { llm: k31p,   effort: [low, high, max] }
    # Synth effort tracks the requested tier (low at the default tier) — reviewed and kept as-is:
    # a `minimal`-effort synth was too weak to attentively weigh one dissenting real-search
    # candidate against several generic non-answers, even with the right prompt (see `4fdd974`).
    # This is NOT drift; don't "fix" it back down without re-confirming with the owner first.
    synthesizer:
      llm: g35fl
      effort: [low, medium, high]
      prompt: synth_default
      search_prompt: synth_search
    show_work: inline
  bmom:
    description: >-
      Big Mom — the balanced, general-purpose workhorse across major providers at medium-to-high
      effort; the default choice for substantive requests.
    effort_tiers: [low, medium, high]
    default_tier: medium
    members:
      - { llm: oai62s, effort: [low, medium, high] }
      - { llm: oai61t, effort: [medium, high, high] }
      - { llm: g4h,    effort: [low, high, high] }
      - { llm: g38f,   effort: [medium, high, high] }
      - { llm: cl55op,  effort: [low, medium, high] }
      # was two members (grok at low and at high) firing at once — one architecture giving two
      # "opinions" isn't opinion diversity, just a spent seat; merged into one tiered member.
      - { llm: grok47, effort: [low, medium, high] }
      - { llm: k31p,   effort: [low, high, max] }
      - glm53
      - qwn38max
    synthesizer:
      llm: g4h
      effort: [low, medium, high]
      prompt: synth_default
      search_prompt: synth_search
    show_work: inline
  hmom:
    description: >-
      Huge Mom — a large panel at high effort spanning many providers and architectures, for hard
      problems that benefit from broad deliberation before synthesis.
    effort_tiers: [low, medium, high]
    default_tier: high
    members:
      - { llm: oai62s, effort: [low, medium, high] }
      - { llm: oai61t, effort: [low, medium, high] }
      # Neon takes 3.1-pro's cells like-for-like: hmom's pro-class Google seat, off at the low
      # tier where the flash seat below already covers the lineage.
      - { llm: g4n,    effort: ["off", low, high] }
      - { llm: g38f,   effort: [low, medium, high] }
      - { llm: cl55op,  effort: [low, medium, high] }
      - { llm: cl55st,  effort: [low, medium, high] }
      - { llm: grok47, effort: [low, medium, high] }
      - { llm: muse13, effort: [low, medium, high] }
      - { llm: ink,    effort: [low, medium, high] }
      - nem3u
      - qwn38max
      - { llm: k31p,   effort: ["off", low, high] }
      - glm53
      - m3
      - longcat2
      - hy4
      - mstl4
      - step37f
    synthesizer:
      llm: g4n
      effort: [low, medium, high]
      prompt: synth_default
      search_prompt: synth_search
    show_work: inline
  emom:
    description: >-
      Elite Mom — flagship models pushed to their maximum reasoning effort, reserved for the
      hardest problems where quality matters more than cost or latency.
    # A narrower, top-of-ladder tier set: even emom's own "low" setting never drops below
    # `high` — dialing effort down further is what mom/bmom/hmom are for.
    effort_tiers: [high, xhigh, max]
    default_tier: max
    members:
      # Reshaped against the AA Intelligence Index v5 (2026-11-23): fable 5.2 (65, #1) replaces
      # 5.1; gpt-6.2-astra (62, #2) replaces gpt-6-astra and gpt-6.2-sol (57) replaces 6.1-sol;
      # the Gemini seat is Neon (60-61, #3). Argon (50) was seated first by name and benched
      # the same day — below the panel's grade. Carbon (59-60) is deliberately unseated: the
      # ~37-min/task deliberate flagship joins per-turn via `include: g4c`, like the other
      # overlay-excluded heavies — it does not run on every fan-out. k31p (Vals 62.5%, the strongest
      # open-weights entry) takes the Kimi seat. ink (AA 20-25 across its line) stays
      # deliberately — owner's call: a genuinely different reasoning philosophy is worth a seat
      # that scores poorly on a general index.
      - { llm: oai62s, effort: [medium, high, xhigh] }
      # The two priciest flagships sit on the panel HERE, where emom describes the ideal roster.
      # A deployment that doesn't want them on every fan-out drops them in its own overlay with
      # `ensembles.emom.members_exclude` — an edit here changes the panel for every deployment.
      - { llm: oai62a, effort: [medium, high, xhigh] }   # same cells as its oai62s sibling
      - { llm: cl55op,  effort: [high, xhigh, max] }
      - { llm: cl55st,  effort: [high, xhigh, max] }
      - { llm: cl52f,  effort: [high, xhigh, max] }
      - { llm: g4n,    effort: [medium, high, high] }  # ladder tops at `high` until litellm learns Gemini-4 xhigh
      - { llm: grok47, effort: [medium, high, xhigh] }  # ceiling rose to xhigh, so the top tier follows it
      # Muse Wonder (2026-10-12) is Meta's frontier line above Spark — it takes the flagship seat
      # here; Spark 1.3 keeps its hmom seat (48 on the AA index, but one lineage gets one seat).
      - { llm: musew,  effort: [high, xhigh, max] }
      - { llm: ink,    effort: [medium, high, max] }
      - glm53
      - mimo26
      - { llm: k31p,   effort: [low, high, max] }
    synthesizer:
      llm: cl55st
      effort: high
      prompt: synth_default
      search_prompt: synth_search
    show_work: inline
  mom-code:
    description: >-
      Coding council — tool-capable and code-specialized models fanned out for programming tasks,
      synthesized by a strong generalist.
    effort_tiers: [low, medium, high]
    default_tier: medium
    members:
      # oai61s (not 6.2-sol) on purpose on the code panels — see the oai62s note up top.
      - { llm: oai61s,   effort: [low, medium, high] }
      - { llm: oai53cdx, effort: ["off", medium, high] }
      - { llm: oai61t,   effort: [low, medium, high] }
      - { llm: g4h,      effort: [low, high, high] }
      - { llm: cl55op,    effort: [low, medium, high] }
      - { llm: grok47,   effort: [medium, high, high] }
      - grokbuild
      - glm53
      - k27code
      - m3
      - mimo26
      - seed2c
      - katair
      - nex25p
    synthesizer:
      llm: g4h
      effort: [low, medium, high]
      prompt: synth_default
      search_prompt: synth_search
