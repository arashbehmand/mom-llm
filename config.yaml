      - "ernie45t"
      - "m2"
    concluding_llm: "g3p:h"
    concluding_prompt: "synth_default"
    include_thinking_context: true

  # Elite mom - top-tier models only (GPT-5.2 Pro here only!)
  - name: "emom"
    llms_to_query:
      - "oai52pro:xh"
      - "g3p:h"
      - "cl46op:h"
      - "grok41fr"
      - "k25"
