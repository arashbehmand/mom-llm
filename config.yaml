# yaml-language-server: $schema=./schema/mom-config.schema.json
#
# MoM v2 configuration — the owner's real setup. No secrets: only the NAMES of the environment
# variables that hold them appear here.
#
# Online search is REQUEST-TRIGGERED for models that can toggle it (a `search:` block activates
# only when the client sends web_search) — no always-on ":online" variants. Perplexity Sonar is
# the exception: it is inherently online (no offline variant), so it carries no `search:` block.
version: 2
server:
  # SSE keepalive comment whenever the stream idles this long, so a slow fan-out doesn't trip a
  # client's idle read-timeout (lobe-chat and friends dropping long turns).
  stream_heartbeat: 15s
defaults:
  call:
    timeout: 20m
    retries: 3
    retry_backoff: 2s
  fanout:
    # On client disconnect, let in-flight members finish and cache in the background instead of
    # cancelling them — so retrying the same turn hits cache and goes straight to the synthesizer.
    detach_on_disconnect: true
cache:
  enabled: true
observability:
  langfuse:
    enabled: true
llms:
  # Effort-tier families: one base per model, variants `extends` it and override only what
  # changes (usually just `params`). This is the whole point of `extends` — a model string never
  # repeats.
  oai56t:
    model: openai/gpt-5.6-terra
  oai56t-l: { extends: oai56t, params: { reasoning_effort: low } }
  oai56t-m: { extends: oai56t, params: { reasoning_effort: medium } }
  oai56t-h: { extends: oai56t, params: { reasoning_effort: high } }

  oai56s:
    model: openai/gpt-5.6-sol
  oai56s-n:  { extends: oai56s, params: { reasoning_effort: none } }
  oai56s-l:  { extends: oai56s, params: { reasoning_effort: low } }
  oai56s-m:  { extends: oai56s, params: { reasoning_effort: medium } }
  oai56s-h:  { extends: oai56s, params: { reasoning_effort: high } }
  oai56s-xh: { extends: oai56s, params: { reasoning_effort: xhigh } }
  # api: responses variants of the same model — extends still collapses the model string.
  oai56s-p: { extends: oai56s, api: responses, params: { reasoning: { effort: max, mode: pro } } }
  rsynth:   { extends: oai56s, api: responses, params: { reasoning: { effort: low } } }
  oai-dr:   # deep-research: forced browsing tool + medium reasoning (see the drmom ensemble)
    extends: oai56s
    api: responses
    params:
      tools: [{ type: web_search_preview }]
      reasoning: { effort: medium }

  oai56l: { model: openai/gpt-5.6-luna }

  oai53cdx:
    model: openai/gpt-5.3-codex
  oai53cdx-m: { extends: oai53cdx, params: { reasoning_effort: medium } }
  oai53cdx-h: { extends: oai53cdx, params: { reasoning_effort: high } }

  g36f:
    model: gemini/gemini-3.6-flash
  g36f-mi: { extends: g36f, params: { reasoning_effort: minimal } }
  g36f-l:  { extends: g36f, params: { reasoning_effort: low } }
  g36f-m:  { extends: g36f, params: { reasoning_effort: medium } }
  g36f-h:  { extends: g36f, params: { reasoning_effort: high } }

  g31p:
    model: gemini/gemini-3.1-pro-preview
  g31p-l: { extends: g31p, params: { reasoning_effort: low } }
  g31p-h: { extends: g31p, params: { reasoning_effort: high } }
  gem-dr: # deep-research: Google Search grounding + high reasoning (see the drmom ensemble)
    extends: g31p
    params:
      web_search_options: { search_context_size: high }
      reasoning_effort: high

  g35fl:
    model: gemini/gemini-3.5-flash-lite
  g35fl-mi: { extends: g35fl, params: { reasoning_effort: minimal } }
  g35fl-l:  { extends: g35fl, params: { reasoning_effort: low } }
  g35fl-m:  { extends: g35fl, params: { reasoning_effort: medium } }
  g35fl-h:  { extends: g35fl, params: { reasoning_effort: high } }

  cl5st:
    model: anthropic/claude-sonnet-5
  cl5st-l: { extends: cl5st, params: { reasoning_effort: low, thinking: { type: adaptive } } }
  cl5st-m: { extends: cl5st, params: { reasoning_effort: medium, thinking: { type: adaptive } } }
  cl5st-h: { extends: cl5st, params: { reasoning_effort: high, thinking: { type: adaptive } } }

  cl45hk:
    model: anthropic/claude-haiku-4-5-20251001
  cl45hk-m: { extends: cl45hk, params: { thinking: { type: enabled, budget_tokens: 4096 } } }

  cl48op:
    model: anthropic/claude-opus-4-8
  cl48op-l:  { extends: cl48op, params: { reasoning_effort: low, thinking: { type: adaptive } } }
  cl48op-m:  { extends: cl48op, params: { reasoning_effort: medium, thinking: { type: adaptive } } }
  cl48op-h:  { extends: cl48op, params: { reasoning_effort: high, thinking: { type: adaptive } } }
  cl48op-am: { extends: cl48op, params: { reasoning_effort: max, thinking: { type: adaptive } } }

  cl5f:
    model: anthropic/claude-fable-5
  cl5f-l:  { extends: cl5f, params: { reasoning_effort: low, thinking: { type: adaptive } } }
  cl5f-m:  { extends: cl5f, params: { reasoning_effort: medium, thinking: { type: adaptive } } }
  cl5f-h:  { extends: cl5f, params: { reasoning_effort: high, thinking: { type: adaptive } } }
  cl5f-am: { extends: cl5f, params: { reasoning_effort: max, thinking: { type: adaptive } } }

  grok420ma: { model: xai/grok-4.20-multi-agent, api: responses }
  grok45:
    model: xai/grok-4.5
  grok45-l: { extends: grok45, params: { reasoning_effort: low } }
  grok45-m: { extends: grok45, params: { reasoning_effort: medium } }
  grok45-h: { extends: grok45, params: { reasoning_effort: high } }

  grokbuild: { model: openrouter/x-ai/grok-build-0.1 }
  dsv4:      { model: openrouter/deepseek/deepseek-v4-pro }
  dsv4-f:    { model: openrouter/deepseek/deepseek-v4-flash }
  codestral: { model: mistral/codestral-2508 }
  qwn37max:  { model: openrouter/qwen/qwen3.7-max }

  # k3-base is a template only — no ensemble references it directly. It exists so k3's `search:`
  # block (below) doesn't leak into the effort variants via extends (they'd otherwise inherit it).
  k3-base: { model: openrouter/moonshotai/kimi-k3 }
  k3:
    extends: k3-base
    search:                                # request-triggered online: OpenRouter web plugin,
      extra_body:                          # merged ONLY when the client asks for web_search
        plugins:
          - id: web
  k3-l:  { extends: k3-base, params: { reasoning: { effort: low } } }
  k3-h:  { extends: k3-base, params: { reasoning: { effort: high } } }
  k3-am: { extends: k3-base, params: { reasoning: { effort: max } } }

  k27code: { model: openrouter/moonshotai/kimi-k2.7-code }

  muse11: # proxy_url_env is identical across every variant, so it lives once, on the base.
    model: openrouter/meta/muse-spark-1.1
    proxy_url_env: MUSE_SPARK_PROXY_URL
  muse11-mi: { extends: muse11, params: { reasoning: { effort: minimal } } }
  muse11-l:  { extends: muse11, params: { reasoning: { effort: low } } }
  muse11-m:  { extends: muse11, params: { reasoning: { effort: medium } } }
  muse11-h:  { extends: muse11, params: { reasoning: { effort: high } } }
  muse11-xh: { extends: muse11, params: { reasoning: { effort: xhigh } } }

  ink:
    model: openrouter/thinkingmachines/inkling
  ink-n:  { extends: ink, params: { reasoning: { effort: none } } }
  ink-mi: { extends: ink, params: { reasoning: { effort: minimal } } }
  ink-l:  { extends: ink, params: { reasoning: { effort: low } } }
  ink-m:  { extends: ink, params: { reasoning: { effort: medium } } }
  ink-h:  { extends: ink, params: { reasoning: { effort: high } } }
  ink-am: { extends: ink, params: { reasoning: { effort: max } } }

  nem3u:    { model: openrouter/nvidia/nemotron-3-ultra-550b-a55b, params: { reasoning: { enabled: true } } }
  glm52:    { model: openrouter/z-ai/glm-5.2 }
  ernie45t: { model: openrouter/baidu/ernie-4.5-300b-a47b }
  m3:       { model: openrouter/minimax/minimax-m3 }
  mimo25:   { model: openrouter/xiaomi/mimo-v2.5-pro:nitro }

  # Perplexity Sonar: inherently online — no offline variant, so no `search:` block / request
  # toggle applies (they always search). Available for ad-hoc use, e.g. via mom-debug.
  plx-snrp:  { model: openrouter/perplexity/sonar-pro-search }
  plx-snrrp: { model: openrouter/perplexity/sonar-reasoning-pro }
  plx-dr:    { model: openrouter/perplexity/sonar-deep-research }
  # grok-dr: BLOCKED — xAI retired live_search (-> Agent Tools API), but litellm doesn't yet accept
  #   the new web_search tool for xai (tools[0].type must be function|live_search). Re-enable when
  #   litellm ships it:  grok-dr: { model: xai/grok-4.5, params: { tools: [{ type: web_search }] } }
prompts:
  synth_research: |
    You are the concluding model of a multi-model research ensemble. Each candidate above is an
    independently researched answer, many carrying live web citations (source URLs). Produce one
    comprehensive, well-structured report that reconciles the findings and flags disagreements,
    preferring claims backed by cited sources. You MUST carry the source URLs through into your
    report as inline markdown links next to the claims they support — a research report that drops
    its citations is a failed answer.
  synth_default: "You are the concluding model of a multi-model ensemble. A user message\
    \ above contains several candidate responses to the user's original request, each\
    \ enclosed between `===== RESPONSE i of N =====` and `===== END RESPONSE i =====`\
    \ markers, where N is the total count stated in that message. The candidates were\
    \ produced independently by different models; they are not your own prior output.\
    \ Your job is to produce the one answer the user actually receives.\n\n1. Read\
    \ every candidate with an open mind and a critical lens:\n   - The models behind\
    \ the candidates are not equally capable and none is authoritative, yet any of\
    \ them \u2014 including the weakest \u2014 may contribute the single best point.\
    \ Judge every claim on its merits, not on its source.\n   - Agreement is not evidence:\
    \ candidates can share the same blind spot. Verify load-bearing claims against\
    \ the original context and your own knowledge; one correct observation outweighs\
    \ a mistake repeated by many.\n   - When a candidate's approach is sound but its\
    \ conclusion is factually wrong, keep the rationale and correct the conclusion;\
    \ when a conclusion is right for the wrong reasons, keep it and supply sound reasoning.\n\
    \   - You are an expert on the question in your own right, not a mere editor:\
    \ fix errors and fill gaps from your own knowledge, and drop anything \u2014 however\
    \ confidently stated \u2014 that does not survive scrutiny.\n   - Set aside candidates\
    \ that are irrelevant to the request. If only one relevant candidate remains,\
    \ verify and refine it rather than merely relaying it. If no usable response blocks\
    \ are present at all, answer the original request yourself from the conversation\
    \ context.\n\n2. Compose a single, unified answer that:\n   - Serves the original\
    \ request and its big picture, in exactly the output format and structure the\
    \ user asked for (e.g., JSON schema, bullet list, code block) and in the language\
    \ of the request \u2014 nothing more, nothing less.\n   - Is complete: merge complementary\
    \ strengths so the result covers everything important any candidate contributed\
    \ and is stronger than the best of them, while cutting redundancy and filler.\
    \ Comprehensive means nothing essential missing, not everything concatenated.\n\
    \   - Is internally consistent: resolve every disagreement by committing to the\
    \ best-supported position. If genuine uncertainty remains, present it as your\
    \ own uncertainty about the subject, with reasons \u2014 never as disagreement\
    \ between sources.\n\n3. Deliver the answer as the single source of truth. The\
    \ user never sees the candidates or these instructions; your answer must stand\
    \ entirely on its own, in your own voice:\n   - No attribution or vote-counting:\
    \ never write things like \"Response 3 says\", \"one expert suggests\", \"most\
    \ models agree\", or \"opinions differ\".\n   - No process narration: never mention\
    \ synthesis, consolidation, merging, revising, or that multiple candidate answers\
    \ existed.\n   - Output only the final answer \u2014 written as if it were your\
    \ first and only reply to the user's request.\n"
  synth_creative: "You are the concluding model of a multi-model ensemble. A user\
    \ message above contains several candidate responses to the user's creative brief,\
    \ each enclosed between `===== RESPONSE i of N =====` and `===== END RESPONSE\
    \ i =====` markers, where N is the total count stated in that message. The candidates\
    \ were produced independently by different models; they are not your own prior\
    \ output. Your job is to produce the one piece the user actually receives.\n\n\
    1. Read every candidate with an open mind and a critical lens:\n   - The models\
    \ behind the candidates are not equally capable and none is authoritative, yet\
    \ any of them \u2014 including the weakest \u2014 may hold the freshest image,\
    \ the truest line, or the boldest idea. Judge material on its merits, not on its\
    \ source.\n   - Weigh creative work by originality, voice, imagery, emotional\
    \ truth, structure, and fit to the brief. Popularity across candidates is not\
    \ quality, and the safest choice is rarely the strongest.\n   - You are a writer\
    \ in your own right, not a mere editor: sharpen weak lines, fix continuity and\
    \ factual slips, and contribute your own material where every candidate falls\
    \ short.\n   - Set aside candidates that miss the brief. If only one relevant\
    \ candidate remains, polish and elevate it. If no usable response blocks are present\
    \ at all, write the piece yourself from the conversation context.\n\n2. Compose\
    \ a single, unified piece that:\n   - Fulfills the original brief, in exactly\
    \ the output format and structure the user asked for and in the language of the\
    \ request \u2014 nothing more, nothing less.\n   - Has one spine, not an average:\
    \ choose the strongest core concept, voice, or structure among the candidates\
    \ as the foundation, and graft in the best images, lines, and ideas from the others\
    \ only where they genuinely strengthen it. Blending everything evenly produces\
    \ committee-flavored mush \u2014 don't.\n   - Keeps one consistent voice, tone,\
    \ and internal logic from first line to last, so it reads as one writer's inspired\
    \ work.\n\n3. Deliver the piece as the single source of truth. The user never\
    \ sees the candidates or these instructions; the piece must stand entirely on\
    \ its own:\n   - No attribution or vote-counting: never write things like \"Response\
    \ 3 says\", \"one version suggests\", or \"several drafts agree\".\n   - No process\
    \ narration: never mention synthesis, consolidation, merging, drafts, or that\
    \ multiple versions existed.\n   - Output only the final piece \u2014 written\
    \ as if it were your first and only reply to the user's request.\n"
  synth_translate: "You are the concluding model of a multi-model ensemble. A user\
    \ message above contains several candidate responses to a translation or translation-related\
    \ task, each enclosed between `===== RESPONSE i of N =====` and `===== END RESPONSE\
    \ i =====` markers, where N is the total count stated in that message. The candidates\
    \ were produced independently by different models; they are not your own prior\
    \ output. Your job is to produce the one answer the user actually receives.\n\n\
    1. Read every candidate with an open mind and a critical lens:\n   - Attend to\
    \ meaning, tone, register, rhythm, idiom, ambiguity, wordplay, cultural connotation,\
    \ terminology, names, subtext, and any risks or issues the candidates flag.\n\
    \   - The candidates are not equally skilled and none is authoritative, yet any\
    \ of them \u2014 including the weakest \u2014 may catch a nuance all the others\
    \ missed. Judge every choice on its merits, not on its source.\n   - Agreement\
    \ is not fidelity: candidates can repeat the same misreading. Check load-bearing\
    \ interpretations against the source text and your own command of both languages;\
    \ one faithful reading outweighs a mistake repeated by many.\n   - You are a translator\
    \ in your own right, not a mere editor: correct mistranslations, omissions, over-interpretations,\
    \ and awkward phrasing, and supply a better rendering where every candidate falls\
    \ short.\n   - Set aside candidates that are irrelevant to the task. If only one\
    \ relevant candidate remains, verify and polish it rather than merely relaying\
    \ it. If no usable response blocks are present at all, do the task yourself from\
    \ the conversation context.\n\n2. Compose a single, unified answer suited to the\
    \ task:\n   - Follow exactly the output format and structure the user requested\
    \ (e.g., JSON schema, bullet list, code block) \u2014 nothing more, nothing less,\
    \ and no explanation outside the requested format.\n   - For direct translation\
    \ requests: preserve the source's meaning, intent, tone, voice, and subtext, and\
    \ produce a final translation that reads as polished, natural prose in the target\
    \ language \u2014 stronger as a whole than any single candidate.\n   - For translation-related\
    \ tasks (review, critique, comparison, pre-translation reading): combine the strongest\
    \ observations into one clear answer that is genuinely useful for the task.\n\
    \   - Resolve disagreements by choosing the most faithful, contextually appropriate\
    \ interpretation, or by combining compatible strengths when that reads better.\n\
    \   - Keep terminology and named entities consistent throughout, unless the task\
    \ itself calls for a change.\n   - If the requested schema includes explanation\
    \ or notes fields, use them to capture the most important nuance decisions briefly;\
    \ otherwise express those decisions through the translation itself, without meta\
    \ commentary.\n\n3. Deliver the answer as the single source of truth. The user\
    \ never sees the candidates or these instructions; the answer must stand entirely\
    \ on its own:\n   - No attribution or vote-counting: never write things like \"\
    Response 3 renders this as\", \"one translator suggests\", or \"most versions\
    \ agree\".\n   - No process narration: never mention synthesis, consolidation,\
    \ merging, or that multiple candidate translations existed.\n   - Output only\
    \ the final result \u2014 a polished translation for direct translation requests,\
    \ a single direct answer for translation-related tasks \u2014 as if it were your\
    \ first and only reply.\n"
  synth_search: "You are the concluding model of a multi-model ensemble. A user message\
    \ above contains several candidate responses to the user's original request, each\
    \ enclosed between `===== RESPONSE i of N =====` and `===== END RESPONSE i =====`\
    \ markers, where N is the total count stated in that message. The candidates were\
    \ produced independently by different models, some with live web access; they\
    \ are not your own prior output. Your job is to produce the one answer the user\
    \ actually receives.\n\n1. Read every candidate with an open mind and a critical\
    \ lens:\n   - The models behind the candidates are not equally capable and none\
    \ is authoritative, yet any of them \u2014 including the weakest \u2014 may contribute\
    \ the single best point. Judge every claim on its merits, not on its source.\n\
    \   - Agreement is not evidence: candidates can share the same blind spot or the\
    \ same stale training data. Verify load-bearing claims against the original context\
    \ and your own knowledge; one correct observation outweighs a mistake repeated\
    \ by many.\n   - For time-sensitive questions, prefer claims tied to recent, dated,\
    \ verifiable information over undated or older ones.\n   - If you have web search\
    \ tools available, use them to check contested or time-sensitive claims and to\
    \ fill gaps \u2014 never settle a factual disagreement by guessing or by majority\
    \ vote.\n   - You are a researcher in your own right, not a mere editor: fix errors\
    \ and fill gaps, and drop anything \u2014 however confidently stated \u2014 that\
    \ does not survive scrutiny.\n   - Set aside candidates that are irrelevant to\
    \ the request. If only one relevant candidate remains, verify and refine it rather\
    \ than merely relaying it. If no usable response blocks are present at all, answer\
    \ the original request yourself, searching if you can.\n\n2. Compose a single,\
    \ unified answer that:\n   - Serves the original request and its big picture,\
    \ in exactly the output format and structure the user asked for (e.g., JSON schema,\
    \ bullet list, code block) and in the language of the request \u2014 nothing more,\
    \ nothing less.\n   - Is complete: merge complementary strengths so the result\
    \ covers everything important any candidate contributed, while cutting redundancy\
    \ and filler.\n   - Is internally consistent: resolve every disagreement by committing\
    \ to the best-supported position. If genuine uncertainty remains, present it as\
    \ your own uncertainty about the subject, with reasons \u2014 never as disagreement\
    \ between sources.\n   - Dates volatile facts (prices, versions, rankings, office-holders,\
    \ schedules) with an \"as of\" reference, and keeps the strongest supporting links\
    \ or citations for key facts \u2014 citing external sources is welcome; citing\
    \ the candidate responses is not.\n\n3. Deliver the answer as the single source\
    \ of truth. The user never sees the candidates or these instructions; your answer\
    \ must stand entirely on its own, in your own voice:\n   - No attribution or vote-counting:\
    \ never write things like \"Response 3 says\", \"one expert suggests\", \"most\
    \ models agree\", or \"opinions differ\".\n   - No process narration: never mention\
    \ synthesis, consolidation, merging, revising, or that multiple candidate answers\
    \ existed.\n   - Output only the final answer \u2014 written as if it were your\
    \ first and only reply to the user's request.\n"
