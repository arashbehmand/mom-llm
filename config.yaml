# ==============================================================================
# Service Configuration
# ==============================================================================
service:
  timeout_seconds: 1200
  exposed_apis: ["openai"]
  cache_enabled: true
  enable_mom_debug_model: false

# ==============================================================================
# Langfuse Integration
# ==============================================================================
langfuse:
  public_key_env: "LANGFUSE_PUBLIC_KEY"
  secret_key_env: "LANGFUSE_SECRET_KEY"
  host_env: "LANGFUSE_HOST"
