[project]
name = "mom-llm"
version = "2.0.0.dev0"
description = "A Mixture-of-Models OpenAI/Anthropic-compatible LLM gateway that fans out to a panel of models and synthesizes one answer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Arash Behmand" }]
keywords = ["llm", "openai", "anthropic", "gateway", "litellm", "mixture-of-models"]

# Runtime dependencies grow phase by phase as modules land. Phase 1 needs only the app
# factory, settings, logging, and the CLI. (litellm/aiosqlite/redis/langfuse arrive later.)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "platformdirs>=4.2",
]

[project.scripts]
mom = "mom.cli:app"

[project.urls]
Homepage = "https://github.com/arashbehmand/mom-llm"
Repository = "https://github.com/arashbehmand/mom-llm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mom"]

# PEP 735 dependency groups (installed with `uv sync --group <name>`).
[dependency-groups]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "pytest-socket>=0.7",
    "httpx>=0.27",
    "hypothesis>=6.100",
]
dev = [
    { include-group = "test" },
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
]

# ----------------------------------------------------------------------------------------------
# Ruff — the single linter + formatter (Black is retired).
# During the transition the legacy `mom_service/` and old `tests/` are excluded so `ruff check .`
# stays green; they are deleted at the Phase 11 cutover.
# ----------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["mom_service", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM",
    "S",     # flake8-bandit (this is an auth gateway)
    "ASYNC", # blocking-call-in-async — v1's worst runtime bug class
    "DTZ",   # naive datetimes
    "PT",    # pytest style
    "RET", "ARG", "PERF", "LOG", "G", "RUF",
]
ignore = [
    "B008",   # function call in argument defaults (FastAPI/Typer idiom)
]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests_v2/*" = ["S101", "S105", "S106", "S107", "ARG"]  # asserts, fake secrets, unused fixture args
"src/mom/domain/errors.py" = ["N818"]  # domain error vocabulary; base is MomError

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["mom"]
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ----------------------------------------------------------------------------------------------
# mypy — strict, scoped to the new package during transition.
# ----------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/mom"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# The provider SDKs are lazy, optional imports inside the adapters (they arrive as runtime deps
# later in the rebuild) and ship no type stubs; let the adapter boundary be untyped.
[[tool.mypy.overrides]]
module = ["litellm", "langfuse"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------------------------
# pytest — v2 config. Bare `pytest` still uses pytest.ini (the v1 suite) during transition;
# run the v2 suite explicitly with `pytest -c pyproject.toml`.
# ----------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --disable-socket --allow-hosts=127.0.0.1,::1"
testpaths = ["tests_v2"]
pythonpath = ["src"]
asyncio_mode = "auto"

# Coverage gate scope: the core business logic (domain/engine/adapters) plus config. The API,
# runtime composition-root (wiring), store, and CLI layers are exercised by integration/boot tests
# but deliberately kept out of the *enforced* floor — they are I/O- and startup-bound, and the
# hermetic suite intentionally does not fake a whole live boot. `pytest --cov` (no argument) uses
# this source, so the measured set, the CI job, and `fail_under` all agree.
[tool.coverage.run]
source = ["mom.domain", "mom.engine", "mom.adapters", "mom.config"]
branch = true
omit = ["*/tests_v2/*"]

[tool.coverage.report]
precision = 2
# The test job fails when covered lines+branches on the gated packages drop below this floor.
# Currently ~92.6%; held at 90 to leave headroom while stopping silent coverage rot.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    'if __name__ == .__main__.:',
]

# ----------------------------------------------------------------------------------------------
# import-linter — enforce the layered architecture (grows as domain/ports/adapters land).
# Lower layers must not import higher ones: runtime cannot import api; api cannot import cli.
# ----------------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "mom"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["mom.cli", "mom.api", "mom.runtime"]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["mom.domain"]
forbidden_modules = ["mom.api", "mom.runtime", "mom.store", "mom.config", "mom.cli"]
