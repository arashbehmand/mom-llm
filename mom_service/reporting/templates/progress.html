<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoM Request Progress</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-processing { background-color: #3b82f6; animation: pulse 1.5s infinite; }
        .status-completed { background-color: #22c55e; }
        .status-error { background-color: #ef4444; }
        .status-client_dropped { background-color: #f59e0b; }
        .status-aborted { background-color: #f59e0b; }
        .status-warning { background-color: #eab308; }
        .status-unknown { background-color: #9ca3af; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold mb-2 text-gray-800">Request Progress</h1>
        <div class="text-sm text-gray-500 mb-6">ID: {{ request_id }}</div>

        <div id="progress-content"
             hx-get="/api/progress/{{ request_id }}"
             hx-trigger="load, every 2s"
             hx-swap="innerHTML">
            <div class="animate-pulse flex space-x-4">
                <div class="flex-1 space-y-4 py-1">
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="space-y-2">
                        <div class="h-4 bg-gray-200 rounded"></div>
                        <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Client-side rendering of the JSON response from API
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'progress-content') {
                try {
                    const data = JSON.parse(evt.detail.xhr.responseText);
                    renderProgress(data);
                } catch (e) {
                    console.error("Error parsing JSON", e);
                }
            }
        });

        function renderProgress(data) {
            const container = document.getElementById('progress-content');
            
            let html = `
                <div class="mb-6">
                    <div class="flex items-center mb-2">
                        <span class="font-semibold mr-2">Overall Status:</span>
                        <span class="px-2 py-1 rounded text-xs font-bold uppercase 
                            ${data.status === 'processing' ? 'bg-blue-100 text-blue-800' : 
                              data.status === 'completed' ? 'bg-green-100 text-green-800' : 
                              data.status === 'client_dropped' ? 'bg-amber-100 text-amber-800' :
                              data.status === 'error' ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800'}">
                            ${data.status}
                        </span>
                    </div>
                    ${data.error ? `<div class="text-sm text-gray-600">Details: ${data.error}</div>` : ''}
                </div>
            `;

            // Fan-out section
            html += `<div class="mb-6"><h3 class="text-lg font-semibold mb-3 border-b pb-2">Fan-out Models</h3>`;
            
            if (data.fanouts && data.fanouts.length > 0) {
                html += `<div class="grid grid-cols-1 gap-3">`;
                data.fanouts.forEach(fanout => {
                    html += `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded border border-gray-100">
                            <div class="flex items-center">
                                <span class="status-dot status-${fanout.status} mr-3"></span>
                                <span class="font-medium text-gray-700">${fanout.model}</span>
                            </div>
                            <div class="text-sm text-gray-500">
                                ${fanout.tokens ? `${fanout.tokens} tokens` : ''}
                                ${fanout.error ? `<span class="text-red-500 ml-2" title="${fanout.error}">Error</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            } else if (data.status === 'processing') {
                html += `<div class="text-gray-400 italic">Waiting for fan-out tasks to start...</div>`;
            } else {
                html += `<div class="text-gray-400 italic">No fan-out models recorded.</div>`;
            }
            html += `</div>`;

            // Concluding section
            html += `<div><h3 class="text-lg font-semibold mb-3 border-b pb-2">Concluding Model</h3>`;
            if (data.concluding) {
                html += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded border border-gray-100">
                        <div class="flex items-center">
                            <span class="status-dot status-${data.concluding.status} mr-3"></span>
                            <span class="font-medium text-gray-700">${data.concluding.model}</span>
                        </div>
                        <div class="text-sm text-gray-500">
                            ${data.concluding.status === 'processing' ? 'Synthesizing...' :
                              data.concluding.status === 'completed' ? 'Completed' :
                              data.concluding.status === 'aborted' ? 'Aborted' :
                              data.concluding.status === 'error' ? 'Error' : data.concluding.status}
                        </div>
                    </div>
                `;
            } else if (data.status === 'completed') {
                 html += `<div class="text-gray-400 italic">No concluding model used.</div>`;
            } else {
                html += `<div class="text-gray-400 italic">Waiting for fan-out completion...</div>`;
            }
            html += `</div>`;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
